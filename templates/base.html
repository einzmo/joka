<!-- templates/base.html - COMPLETE PRODUCTION VERSION -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>{% block title %}myMSCE{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a2b4c;
            color: white;
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        
        /* Glass Morphism */
        .glass-card {
            background: rgba(30, 58, 95, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        
        .glass-card:hover {
            border-color: rgba(251, 191, 36, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.3);
        }
        
        /* Animated Gradient Border */
        .gradient-border {
            position: relative;
            background: rgba(30, 58, 95, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 24px;
        }
        
        .gradient-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #fbbf24, #2563eb, #fbbf24);
            border-radius: 26px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        
        .gradient-border:hover::before {
            opacity: 1;
        }
        
        /* Premium Toast Container */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        
        .toast {
            background: rgba(26, 43, 76, 0.98);
            backdrop-filter: blur(20px);
            border-left: 4px solid #fbbf24;
            border-radius: 16px;
            min-width: 280px;
            max-width: 380px;
            pointer-events: auto;
            animation: toastSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        
        .toast-content {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .toast-progress {
            height: 3px;
            background: rgba(251, 191, 36, 0.3);
            width: 100%;
        }
        
        .toast-progress-bar {
            height: 100%;
            width: 100%;
            background: #fbbf24;
            animation: toastProgress 4s linear forwards;
        }
        
        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
        
        .toast-exit {
            animation: toastSlideOut 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
        
        @keyframes toastSlideOut {
            to { opacity: 0; transform: translateX(100%); }
        }
        
        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(251,191,36,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Navigation */
        .nav-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(26, 43, 76, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.1);
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px;
            flex-wrap: wrap;
        }
        
        .breadcrumb-item {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .breadcrumb-item:hover {
            color: #fbbf24;
        }
        
        .breadcrumb-item.active {
            color: #fbbf24;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 43, 76, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(251, 191, 36, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px 20px;
            z-index: 100;
        }
        
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.7rem;
            transition: all 0.2s;
            padding: 8px 16px;
            border-radius: 40px;
        }
        
        .bottom-nav-item i {
            font-size: 1.3rem;
        }
        
        .bottom-nav-item.active {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }
        
        /* Scroll to Top */
        .scroll-top {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(251,191,36,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 99;
        }
        
        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            background: rgba(30,58,95,0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(251,191,36,0.2);
            overflow: auto;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: #1a2b4c;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251,191,36,0.3);
        }
        
        .text-gold { color: #fbbf24; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="nav-container">
        <div class="breadcrumb">
            <a href="{{ url_for('dashboard') }}" class="breadcrumb-item">Dashboard</a>
            {% block breadcrumb %}{% endblock %}
        </div>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>
    <div id="modalOverlay" class="modal-overlay">
        <div id="modalContent" class="modal-content"></div>
    </div>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <div class="bottom-nav">
        <a href="{{ url_for('dashboard') }}" class="bottom-nav-item" id="nav-dashboard">
            <i class="bi bi-house"></i><span>Home</span>
        </a>
        <a href="{{ url_for('pricing') }}" class="bottom-nav-item" id="nav-pricing">
            <i class="bi bi-tag"></i><span>Plans</span>
        </a>
        <a href="{{ url_for('profile') }}" class="bottom-nav-item" id="nav-profile">
            <i class="bi bi-person"></i><span>Profile</span>
        </a>
        <a href="{{ url_for('user_menu') }}" class="bottom-nav-item" id="nav-menu">
            <i class="bi bi-grid"></i><span>Menu</span>
        </a>
    </div>
    
    <div class="scroll-top" id="scrollTop">
        <i class="bi bi-arrow-up"></i>
    </div>
    
    <script>
        // ===== TOAST MANAGER =====
        class ToastManager {
            constructor() {
                this.container = document.getElementById('toastContainer');
            }
            
            show(message, type = 'info', duration = 4000) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                
                const icons = { success: 'check-circle-fill', error: 'exclamation-circle-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill' };
                const colors = { success: '#10b981', error: '#ef4444', warning: '#fbbf24', info: '#fbbf24' };
                
                toast.innerHTML = `
                    <div class="toast-content">
                        <i class="bi bi-${icons[type] || icons.info}" style="color: ${colors[type] || colors.info}; font-size: 1.3rem;"></i>
                        <div style="flex:1; color:white;">${message}</div>
                        <button onclick="this.closest('.toast').remove()" style="background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer;"><i class="bi bi-x"></i></button>
                    </div>
                    <div class="toast-progress"><div class="toast-progress-bar" style="animation-duration: ${duration}ms;"></div></div>
                `;
                
                this.container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('toast-exit');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }
        }
        
        window.toastManager = new ToastManager();
        window.showToast = (m, t, d) => window.toastManager.show(m, t, d);
        
        // ===== WHATSAPP-STYLE BACK BUTTON =====
        (function() {
            const isDashboard = window.location.pathname === '/dashboard' || window.location.pathname === '/';
            let backPressedOnce = false, backTimer = null;
            
            window.history.replaceState({ page: 'current' }, '', window.location.href);
            
            window.addEventListener('popstate', function(event) {
                if (isDashboard) {
                    if (backPressedOnce) {
                        window.close();
                        window.location.href = 'about:blank';
                    } else {
                        backPressedOnce = true;
                        window.toastManager.show('Press back again to exit', 'info', 3000);
                        if (backTimer) clearTimeout(backTimer);
                        backTimer = setTimeout(() => backPressedOnce = false, 3000);
                        window.history.pushState({ page: 'current' }, '', window.location.href);
                    }
                } else {
                    window.toastManager.show('Use navigation menu', 'info', 2000);
                    window.location.href = '/dashboard';
                }
            });
            
            window.history.pushState({ page: 'current' }, '', window.location.href);
            
            // Highlight current nav
            const path = window.location.pathname;
            document.querySelectorAll('.bottom-nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (href && (path === href || (href !== '/' && path.startsWith(href)))) {
                    item.classList.add('active');
                }
            });
        })();
        
        // ===== SCROLL TO TOP =====
        const scrollTop = document.getElementById('scrollTop');
        if (scrollTop) {
            window.addEventListener('scroll', () => {
                scrollTop.classList.toggle('visible', window.scrollY > 300);
            });
            scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
        
        // ===== MODAL MANAGER =====
        window.ModalManager = {
            overlay: document.getElementById('modalOverlay'),
            content: document.getElementById('modalContent'),
            open(html) { this.content.innerHTML = html; this.overlay.classList.add('active'); document.body.style.overflow = 'hidden'; },
            close() { this.overlay.classList.remove('active'); this.content.innerHTML = ''; document.body.style.overflow = ''; }
        };
        document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) ModalManager.close();
        });
        
        // ===== CACHE MANAGER =====
        window.CacheManager = {
            set(key, data, ttl = 3600000) { localStorage.setItem(key, JSON.stringify({ data, expiry: Date.now() + ttl })); },
            get(key) {
                const item = localStorage.getItem(key);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (Date.now() > parsed.expiry) { localStorage.removeItem(key); return null; }
                return parsed.data;
            },
            remove(key) { localStorage.removeItem(key); },
            clear() { localStorage.clear(); }
        };
        
        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && window.player) { e.preventDefault(); window.player.paused ? window.player.play() : window.player.pause(); }
            if (e.code === 'ArrowLeft' && window.prevLessonUrl) window.location.href = window.prevLessonUrl;
            if (e.code === 'ArrowRight' && window.nextLessonUrl) window.location.href = window.nextLessonUrl;
        });
        
        // Flash messages
        document.addEventListener('DOMContentLoaded', () => {
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        setTimeout(() => window.toastManager.show("{{ message|safe }}", "{{ category if category in ['success','error','warning'] else 'info' }}"), 100);
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
