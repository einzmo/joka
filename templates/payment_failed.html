<!-- templates/payment_failed.html - COMPLETE REDESIGN with Blue/Green/Orange Theme -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Payment Failed - myMSCE</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/history-manager.js') }}"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EFF6FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0F172A;
        }

        /* ===== COLOR SYSTEM (Matching Dashboard) ===== */
        :root {
            --primary-blue: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --primary-glass: rgba(37, 99, 235, 0.12);
            --secondary-green: #16A34A;
            --secondary-light: #DCFCE7;
            --accent-orange: #F59E0B;
            --accent-dark: #D97706;
            --error-red: #DC2626;
            --error-light: #FEE2E2;
            --bg-main: #EFF6FF;
            --card-bg-glass: rgba(219, 234, 254, 0.7);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #64748B;
            --border-light: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* ===== PAGE LOADER (Matching Dashboard) ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #EFF6FF;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .glass-loader {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            backdrop-filter: blur(10px);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        .glass-loader::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #2563EB, #16A34A, transparent);
            animation: spin 1.5s linear infinite;
        }
        
        .glass-loader::after {
            content: '';
            position: absolute;
            inset: 8px;
            background: #EFF6FF;
            border-radius: 50%;
        }
        
        .glass-loader .inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563EB, #16A34A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.1); }
            50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.2); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== FAILED CARD ===== */
        .failed-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid rgba(220, 38, 38, 0.25);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
            position: relative;
        }
        
        .card-accent {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #DC2626, #F87171);
        }
        
        .card-content {
            padding: 40px 32px;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .card-content { padding: 32px 24px; }
        }

        /* ===== ERROR ICON ===== */
        .icon-container {
            margin-bottom: 28px;
            text-align: center;
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(220, 38, 38, 0.3);
            animation: softPulse 2s infinite;
        }
        
        .error-icon i {
            font-size: 3.5rem;
            color: #DC2626;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.3));
        }
        
        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(220, 38, 38, 0.3);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.2);
            }
            50% {
                transform: scale(1.03);
                border-color: rgba(220, 38, 38, 0.6);
                box-shadow: 0 0 0 15px rgba(220, 38, 38, 0);
            }
        }
        
        @media (max-width: 480px) {
            .error-icon { width: 80px; height: 80px; }
            .error-icon i { font-size: 2.8rem; }
        }

        /* ===== TYPOGRAPHY ===== */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #DC2626, #F87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .lead {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ===== INFO BOX ===== */
        .info-box {
            background: rgba(220, 38, 38, 0.06);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            border: 1px solid rgba(220, 38, 38, 0.15);
            border-left: 4px solid #F59E0B;
        }
        
        .info-box i {
            font-size: 1.3rem;
            color: #F59E0B;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .info-box p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }
        
        .info-box strong {
            color: #16A34A;
            font-weight: 600;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-primary {
            background: #F59E0B;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .btn-primary:active { background: #D97706; }
        .btn-primary i { transition: transform 0.2s; }
        .btn-primary:active i { transform: translateX(4px); }
        
        .btn-secondary {
            background: rgba(37, 99, 235, 0.08);
            color: #2563EB;
            border: 1px solid rgba(37, 99, 235, 0.25);
        }
        
        .btn-secondary:active {
            background: rgba(37, 99, 235, 0.15);
        }
        
        .btn-secondary i {
            transition: transform 0.2s;
        }
        
        .btn-secondary:active i {
            transform: translateX(-4px);
        }

        /* ===== SUPPORT LINK ===== */
        .support-link {
            text-align: center;
            margin-top: 8px;
        }
        
        .support-link a {
            color: #2563EB;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.2s;
        }
        
        .support-link a:active {
            background: rgba(37, 99, 235, 0.08);
        }
        
        .support-link a i {
            font-size: 0.9rem;
        }

        /* ===== SKELETON CARD ===== */
        .skeleton-card {
            background: rgba(219, 234, 254, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .skeleton-accent {
            height: 4px;
            background: rgba(220, 38, 38, 0.2);
        }
        
        .skeleton-content {
            padding: 40px 32px;
        }
        
        .skeleton-icon {
            width: 100px;
            height: 100px;
            background: rgba(220, 38, 38, 0.08);
            border-radius: 50%;
            margin: 0 auto 28px;
        }
        
        .skeleton-line {
            height: 16px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .skeleton-line.title {
            width: 50%;
            height: 36px;
            margin: 0 auto 12px;
        }
        
        .skeleton-line.subtitle {
            width: 65%;
            height: 20px;
            margin: 0 auto 28px;
        }
        
        .skeleton-info {
            background: rgba(220, 38, 38, 0.04);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 32px;
        }
        
        .skeleton-button {
            width: 100%;
            height: 52px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50px;
            margin-bottom: 12px;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.04) 25%, rgba(37, 99, 235, 0.12) 50%, rgba(37, 99, 235, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }
        
        .toast {
            background: #1E293B;
            border-left: 4px solid #2563EB;
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 380px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .toast.error { border-left-color: #DC2626; }
        .toast.success { border-left-color: #16A34A; }
        .toast.warning { border-left-color: #F59E0B; }
        
        .toast button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            margin-left: auto;
            cursor: pointer;
            font-size: 1rem;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card-content { padding: 32px 24px; }
            h1 { font-size: 1.6rem; }
            .lead { font-size: 0.9rem; }
        }

        /* ===== SAFE AREAS ===== */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-top: max(24px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="glass-loader">
            <div class="inner">M</div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <!-- Skeleton Card (shown initially) -->
        <div class="skeleton-card" id="skeletonCard">
            <div class="skeleton-accent shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-icon shimmer"></div>
                <div class="skeleton-line title shimmer"></div>
                <div class="skeleton-line subtitle shimmer"></div>
                <div class="skeleton-info shimmer">
                    <div style="display: flex; gap: 14px;">
                        <div class="skeleton-line" style="width: 40px; height: 40px; border-radius: 20px;"></div>
                        <div class="skeleton-line" style="flex: 1; height: 40px;"></div>
                    </div>
                </div>
                <div class="skeleton-button shimmer"></div>
                <div class="skeleton-button shimmer"></div>
                <div class="skeleton-line" style="width: 40%; height: 16px; margin: 16px auto 0;"></div>
            </div>
        </div>

        <!-- Real Content (hidden initially) -->
        <div class="failed-card" id="realCard" style="display: none;">
            <div class="card-accent"></div>
            <div class="card-content">
                <!-- Error Icon -->
                <div class="icon-container">
                    <div class="error-icon">
                        <i class="bi bi-x-circle-fill"></i>
                    </div>
                </div>

                <!-- Title -->
                <h1>Payment Failed</h1>
                <p class="lead">There was an issue processing your payment.</p>

                <!-- Info Box - Reassuring Message -->
                <div class="info-box">
                    <i class="bi bi-shield-check"></i>
                    <p>
                        <strong>Don't worry!</strong> Your account has not been charged.
                        Please try again or contact support if the problem persists.
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="actions">
                    <a href="{{ url_for('pricing') }}" class="btn btn-primary">
                        <i class="bi bi-arrow-repeat"></i>
                        Try Again
                    </a>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                        <i class="bi bi-house-door"></i>
                        Go to Dashboard
                    </a>
                </div>

                <!-- Support Link -->
                <div class="support-link">
                    <a href="#" onclick="showToast('Contact support: support@mymsce.com', 'info'); return false;">
                        <i class="bi bi-headset"></i>
                        Need help? Contact Support
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== TOAST FUNCTION =====
        function showToast(message, type = 'info', duration = 5000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            if (container.children.length >= 3) {
                container.children[0].remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? 'check-circle-fill' :
                      type === 'error' ? 'exclamation-triangle-fill' :
                      type === 'warning' ? 'exclamation-triangle-fill' : 'info-circle-fill';

            toast.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <span>${message}</span>
                <button onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, duration);
        }

        // ===== PAGE LOAD SIMULATION (Matching Dashboard Timing) =====
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loader after 800ms
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if(loader) loader.classList.add('hidden');
            }, 800);

            // Show skeleton for 800ms, then real content
            setTimeout(() => {
                const skeleton = document.getElementById('skeletonCard');
                const real = document.getElementById('realCard');
                if(skeleton) skeleton.style.display = 'none';
                if(real) real.style.display = 'block';
            }, 1000);

            // Show any flashed messages
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        setTimeout(() => {
                            showToast("{{ message|safe }}", "{{ category if category in ['success', 'error', 'warning'] else 'info' }}");
                        }, {{ (loop.index0 * 200) + 1200 }});
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });

        // ===== AUTO-REDIRECT TIMER (commented out - preserved for future use) =====
        // Uncomment this block to enable auto-redirect after 10 seconds
        /*
        let secondsLeft = 10;
        const timerContainer = document.createElement('div');
        timerContainer.style.marginTop = '16px';
        timerContainer.style.textAlign = 'center';
        timerContainer.style.fontSize = '0.75rem';
        timerContainer.style.color = 'var(--text-tertiary)';
        timerContainer.style.position = 'relative';
        timerContainer.style.zIndex = '2';
        timerContainer.innerHTML = `Redirecting to pricing in ${secondsLeft} seconds...`;

        const actionsDiv = document.querySelector('.actions');
        if (actionsDiv) actionsDiv.after(timerContainer);

        const timerInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft >= 0 && timerContainer) {
                timerContainer.innerHTML = `Redirecting to pricing in ${secondsLeft} seconds...`;
            }
            if (secondsLeft < 0) {
                clearInterval(timerInterval);
                window.location.href = "{{ url_for('pricing') }}";
            }
        }, 1000);
        */
    </script>
</body>
</html>
