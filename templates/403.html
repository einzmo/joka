<!-- templates/403.html - COMPLETE REDESIGN with Blue/Green/Orange Theme -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Access Denied - myMSCE</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/history-manager.js') }}"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EFF6FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0F172A;
        }

        /* ===== COLOR SYSTEM ===== */
        :root {
            --primary-blue: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --secondary-green: #16A34A;
            --secondary-light: #DCFCE7;
            --accent-orange: #F59E0B;
            --accent-dark: #D97706;
            --warning-red: #DC2626;
            --warning-light: #FEE2E2;
            --bg-main: #EFF6FF;
            --card-bg-glass: rgba(219, 234, 254, 0.7);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #64748B;
            --border-light: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* ===== PAGE LOADER ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #EFF6FF;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .glass-loader {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            backdrop-filter: blur(10px);
            animation: pulseGlow 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .glass-loader::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #2563EB, #16A34A, transparent);
            animation: spin 1.5s linear infinite;
        }
        
        .glass-loader::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            background: #EFF6FF;
            border-radius: 50%;
        }
        
        .glass-loader .inner {
            position: relative;
            z-index: 2;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563EB, #16A34A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.1); }
            50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.2); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ===== ERROR CARD ===== */
        .error-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid rgba(220, 38, 38, 0.25);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
            position: relative;
        }
        
        .card-accent {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #DC2626, #F87171);
        }
        
        .card-content {
            padding: 48px 32px;
            text-align: center;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .card-content { padding: 40px 24px; }
        }

        /* ===== ERROR ICON ===== */
        .icon-container {
            margin-bottom: 28px;
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(220, 38, 38, 0.3);
            animation: softPulse 2s infinite;
        }
        
        .error-icon i {
            font-size: 3.5rem;
            color: #DC2626;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.3));
        }
        
        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(220, 38, 38, 0.3);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.2);
            }
            50% {
                transform: scale(1.03);
                border-color: rgba(220, 38, 38, 0.6);
                box-shadow: 0 0 0 15px rgba(220, 38, 38, 0);
            }
        }
        
        @media (max-width: 480px) {
            .error-icon { width: 80px; height: 80px; }
            .error-icon i { font-size: 2.8rem; }
        }

        /* ===== ERROR CODE ===== */
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #DC2626, #F87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @media (max-width: 480px) {
            .error-code { font-size: 3.5rem; }
        }

        /* ===== TITLE ===== */
        .error-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        @media (max-width: 480px) {
            .error-title { font-size: 1.5rem; }
        }

        /* ===== MESSAGE ===== */
        .error-message {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #DC2626, transparent);
            margin: 24px auto;
        }

        /* ===== BUTTONS ===== */
        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            min-width: 140px;
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: #F59E0B;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .btn-primary:active {
            background: #D97706;
        }
        
        .btn-secondary {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
            border: 1px solid rgba(37, 99, 235, 0.25);
        }
        
        .btn-secondary:active {
            background: rgba(37, 99, 235, 0.15);
        }
        
        @media (max-width: 480px) {
            .button-group { flex-direction: column; }
            .btn { width: 100%; }
        }

        /* ===== DECORATIVE PATTERNS ===== */
        .dots-pattern {
            position: absolute;
            bottom: 20px;
            right: 20px;
            opacity: 0.15;
            font-size: 1.5rem;
            color: #DC2626;
            letter-spacing: 6px;
            pointer-events: none;
            transform: rotate(-15deg);
        }
        
        .dots-pattern-left {
            position: absolute;
            top: 20px;
            left: 20px;
            opacity: 0.15;
            font-size: 1.5rem;
            color: #2563EB;
            letter-spacing: 6px;
            pointer-events: none;
            transform: rotate(15deg);
        }

        /* ===== SKELETON LOADING ===== */
        .skeleton-card {
            background: rgba(219, 234, 254, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .skeleton-accent {
            height: 4px;
            background: rgba(220, 38, 38, 0.2);
        }
        
        .skeleton-content {
            padding: 48px 32px;
            text-align: center;
        }
        
        .skeleton-icon {
            width: 100px;
            height: 100px;
            background: rgba(220, 38, 38, 0.08);
            border-radius: 50%;
            margin: 0 auto 28px;
        }
        
        .skeleton-line {
            height: 14px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .skeleton-line.code {
            width: 40%;
            height: 48px;
            margin: 0 auto 16px;
        }
        
        .skeleton-line.title {
            width: 50%;
            height: 28px;
            margin: 0 auto 12px;
        }
        
        .skeleton-line.subtitle {
            width: 70%;
            height: 20px;
            margin: 0 auto 28px;
        }
        
        .skeleton-button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 24px;
        }
        
        .skeleton-button {
            width: 140px;
            height: 52px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50px;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.04) 25%, rgba(37, 99, 235, 0.12) 50%, rgba(37, 99, 235, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }
        
        .toast {
            background: #1E293B;
            border-left: 4px solid #2563EB;
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 380px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .toast button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            margin-left: auto;
            cursor: pointer;
            font-size: 1rem;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Safe Areas */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-top: max(24px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
            .toast-container {
                top: max(20px, env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="glass-loader">
            <div class="inner">M</div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <!-- Skeleton Content (shown initially) -->
        <div id="skeletonContent">
            <div class="skeleton-card shimmer">
                <div class="skeleton-accent shimmer"></div>
                <div class="skeleton-content">
                    <div class="skeleton-icon shimmer"></div>
                    <div class="skeleton-line code shimmer"></div>
                    <div class="skeleton-line title shimmer"></div>
                    <div class="skeleton-line subtitle shimmer"></div>
                    <div class="skeleton-button-group">
                        <div class="skeleton-button shimmer"></div>
                        <div class="skeleton-button shimmer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Real Content (hidden initially) -->
        <div id="realContent" style="display: none;">
            <div class="error-card">
                <div class="card-accent"></div>
                <div class="card-content">
                    <!-- Decorative Patterns -->
                    <div class="dots-pattern">......</div>
                    <div class="dots-pattern-left">......</div>
                    
                    <!-- Icon -->
                    <div class="icon-container">
                        <div class="error-icon">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                    </div>

                    <!-- Error Code -->
                    <div class="error-code">403</div>

                    <!-- Title -->
                    <h1 class="error-title">Access Denied</h1>

                    <!-- Message -->
                    <p class="error-message">
                        You don't have permission to access this page. Please check your credentials or contact support if you believe this is an error.
                    </p>

                    <!-- Divider -->
                    <div class="divider"></div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <a href="javascript:history.back()" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i>
                            Go Back
                        </a>
                        <a href="{{ url_for('index') }}" class="btn btn-primary">
                            <i class="bi bi-house-door"></i>
                            Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toast function
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'check-circle', error: 'exclamation-circle', warning: 'exclamation-triangle', info: 'info-circle' };
            const icon = icons[type] || icons.info;
            toast.innerHTML = `<i class="bi bi-${icon}-fill"></i><span>${message}</span><button onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; setTimeout(() => toast.remove(), 300); }, duration);
        }

        // Loading animation (matching dashboard timing)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const skeleton = document.getElementById('skeletonContent');
                const real = document.getElementById('realContent');
                if(skeleton) skeleton.style.display = 'none';
                if(real) real.style.display = 'block';
            }, 800);
            
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if(loader) loader.classList.add('hidden');
            }, 1200);
        });

        // Flash messages
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    setTimeout(() => showToast("{{ message|safe }}", "{{ category if category in ['success','error','warning'] else 'info' }}"), {{ loop.index0 * 200 + 500 }});
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
