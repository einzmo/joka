<!-- templates/payment_success.html - COMPLETE REDESIGN with Blue/Green/Orange Theme -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Payment Successful - myMSCE</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/history-manager.js') }}"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EFF6FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0F172A;
        }

        /* ===== COLOR SYSTEM (Matching Dashboard) ===== */
        :root {
            --primary-blue: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --primary-glass: rgba(37, 99, 235, 0.12);
            --secondary-green: #16A34A;
            --secondary-light: #DCFCE7;
            --accent-orange: #F59E0B;
            --accent-dark: #D97706;
            --error-red: #DC2626;
            --bg-main: #EFF6FF;
            --card-bg-glass: rgba(219, 234, 254, 0.7);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #64748B;
            --border-light: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* ===== PAGE LOADER (Matching Dashboard) ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #EFF6FF;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .glass-loader {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            backdrop-filter: blur(10px);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        .glass-loader::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #2563EB, #16A34A, transparent);
            animation: spin 1.5s linear infinite;
        }
        
        .glass-loader::after {
            content: '';
            position: absolute;
            inset: 8px;
            background: #EFF6FF;
            border-radius: 50%;
        }
        
        .glass-loader .inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563EB, #16A34A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.1); }
            50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.2); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== SUCCESS CARD ===== */
        .success-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid var(--border-light);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
            position: relative;
        }
        
        .card-accent {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #2563EB, #16A34A);
        }
        
        .card-content {
            padding: 48px 32px;
            text-align: center;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .card-content { padding: 36px 24px; }
        }

        /* ===== SUCCESS ICON ===== */
        .icon-container {
            margin-bottom: 28px;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: rgba(22, 163, 74, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(22, 163, 74, 0.3);
            animation: scaleIn 0.5s ease, softPulse 2s infinite;
        }
        
        .success-icon i {
            font-size: 3.5rem;
            color: #16A34A;
            filter: drop-shadow(0 0 10px rgba(22, 163, 74, 0.3));
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(22, 163, 74, 0.3);
                box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.2);
            }
            50% {
                transform: scale(1.03);
                border-color: rgba(22, 163, 74, 0.6);
                box-shadow: 0 0 0 15px rgba(22, 163, 74, 0);
            }
        }
        
        @media (max-width: 480px) {
            .success-icon { width: 80px; height: 80px; }
            .success-icon i { font-size: 2.8rem; }
        }

        /* ===== TYPOGRAPHY ===== */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2563EB, #16A34A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ===== INFO BOX ===== */
        .info-box {
            background: rgba(22, 163, 74, 0.06);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(22, 163, 74, 0.15);
            text-align: left;
        }
        
        .info-box i {
            font-size: 1.2rem;
            color: #16A34A;
            flex-shrink: 0;
        }
        
        .info-box p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0;
        }
        
        .info-box strong {
            color: #16A34A;
            font-weight: 600;
        }

        /* ===== ACTION BUTTON ===== */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
            background: #F59E0B;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
            background: #D97706;
        }
        
        .btn i {
            transition: transform 0.2s;
        }
        
        .btn:active i {
            transform: translateX(4px);
        }

        /* ===== FOOTER NOTE ===== */
        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: var(--text-tertiary);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .footer-note i {
            color: #16A34A;
        }

        /* ===== CONFETTI CANVAS ===== */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* ===== SKELETON CARD ===== */
        .skeleton-card {
            background: rgba(219, 234, 254, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .skeleton-accent {
            height: 4px;
            background: rgba(37, 99, 235, 0.15);
        }
        
        .skeleton-content {
            padding: 48px 32px;
            text-align: center;
        }
        
        .skeleton-icon {
            width: 100px;
            height: 100px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50%;
            margin: 0 auto 28px;
        }
        
        .skeleton-line {
            height: 16px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .skeleton-line.title {
            width: 50%;
            height: 36px;
            margin: 0 auto 12px;
        }
        
        .skeleton-line.subtitle {
            width: 70%;
            height: 20px;
            margin: 0 auto 28px;
        }
        
        .skeleton-button {
            width: 100%;
            height: 56px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50px;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.04) 25%, rgba(37, 99, 235, 0.12) 50%, rgba(37, 99, 235, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }
        
        .toast {
            background: #1E293B;
            border-left: 4px solid #2563EB;
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 380px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .toast.error { border-left-color: #DC2626; }
        .toast.success { border-left-color: #16A34A; }
        .toast.warning { border-left-color: #F59E0B; }
        
        .toast button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            margin-left: auto;
            cursor: pointer;
            font-size: 1rem;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card-content { padding: 36px 24px; }
            h1 { font-size: 1.6rem; }
            .message { font-size: 0.9rem; }
        }

        /* ===== SAFE AREAS ===== */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-top: max(24px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="glass-loader">
            <div class="inner">M</div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <!-- Skeleton Card (shown initially) -->
        <div class="skeleton-card" id="skeletonCard">
            <div class="skeleton-accent shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-icon shimmer"></div>
                <div class="skeleton-line title shimmer"></div>
                <div class="skeleton-line subtitle shimmer"></div>
                <div class="skeleton-button shimmer"></div>
            </div>
        </div>

        <!-- Real Content (hidden initially) -->
        <div class="success-card" id="realCard" style="display: none;">
            <div class="card-accent"></div>
            <div class="card-content">
                <!-- Success Icon -->
                <div class="icon-container">
                    <div class="success-icon">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                </div>

                <!-- Title -->
                <h1>Payment Successful!</h1>
                <p class="message">Thank you for subscribing to myMSCE. Your account has been upgraded and you now have full access to all lessons.</p>

                <!-- Info Box -->
                <div class="info-box">
                    <i class="bi bi-star-fill"></i>
                    <p>
                        <strong>You're all set!</strong> Start exploring your lessons and prepare for your MSCE exams.
                    </p>
                </div>

                <!-- Action Button -->
                <a href="{{ url_for('dashboard') }}" class="btn">
                    <i class="bi bi-speedometer2"></i>
                    Go to Dashboard
                    <i class="bi bi-arrow-right"></i>
                </a>

                <!-- Footer Note -->
                <div class="footer-note">
                    <i class="bi bi-shield-check"></i>
                    Receipt sent to your email
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== TOAST FUNCTION =====
        function showToast(message, type = 'info', duration = 5000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            if (container.children.length >= 3) {
                container.children[0].remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? 'check-circle-fill' :
                      type === 'error' ? 'exclamation-triangle-fill' :
                      type === 'warning' ? 'exclamation-triangle-fill' : 'info-circle-fill';

            toast.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <span>${message}</span>
                <button onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, duration);
        }

        // ===== CONFETTI EFFECT =====
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#2563EB', '#16A34A', '#F59E0B', '#3B82F6', '#22C55E', '#FBBF24'];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: Math.random() * 8 + 4,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            
            let animationId;
            let startTime = Date.now();
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let allFinished = true;
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    
                    if (p.y < canvas.height + 100) {
                        allFinished = false;
                        p.x += p.speedX;
                        p.y += p.speedY;
                        p.rotation += p.rotationSpeed;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                }
                
                if (!allFinished && Date.now() - startTime < 4000) {
                    animationId = requestAnimationFrame(draw);
                } else {
                    cancelAnimationFrame(animationId);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            draw();
            
            // Clean up after 4 seconds
            setTimeout(() => {
                if (animationId) cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 4000);
        }

        // ===== PAGE LOAD SIMULATION (Matching Dashboard Timing) =====
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loader after 800ms
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if(loader) loader.classList.add('hidden');
            }, 800);

            // Show skeleton for 800ms, then real content
            setTimeout(() => {
                const skeleton = document.getElementById('skeletonCard');
                const real = document.getElementById('realCard');
                if(skeleton) skeleton.style.display = 'none';
                if(real) real.style.display = 'block';
                
                // Start confetti celebration
                startConfetti();
            }, 1000);

            // Show any flashed messages
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        setTimeout(() => {
                            showToast("{{ message|safe }}", "{{ category if category in ['success', 'error', 'warning'] else 'info' }}");
                        }, {{ (loop.index0 * 200) + 1200 }});
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });

        // Handle window resize for confetti canvas
        window.addEventListener('resize', function() {
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
