<!-- templates/payment_status.html - FIXED (Single Notification) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Payment Status - myMSCE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/history-manager.js') }}"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EFF6FF;
            min-height: 100vh;
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        :root {
            --primary-blue: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --secondary-green: #16A34A;
            --secondary-light: #DCFCE7;
            --accent-orange: #F59E0B;
            --accent-dark: #D97706;
            --error-red: #DC2626;
            --bg-main: #EFF6FF;
            --card-bg-glass: rgba(219, 234, 254, 0.7);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #64748B;
            --border-light: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* ===== PAGE LOADER - CENTERED DOTS ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #EFF6FF;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .page-loader.hidden { opacity: 0; visibility: hidden; }

        .dots-loader {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #2563EB, #16A34A);
            border-radius: 50%;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.4; }
            to { transform: translateY(-20px); opacity: 1; }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== STATUS CARD ===== */
        .status-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid var(--border-light);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
            position: relative;
        }
        
        .card-accent {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #2563EB, #16A34A);
        }
        
        .card-content {
            padding: 40px 32px;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .card-content { padding: 32px 24px; }
        }

        /* ===== ICON CONTAINER ===== */
        .icon-container {
            margin-bottom: 28px;
            text-align: center;
        }
        
        .pending-spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border: 3px solid rgba(37, 99, 235, 0.15);
            border-top: 3px solid #2563EB;
            border-right: 3px solid #16A34A;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: rgba(22, 163, 74, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(22, 163, 74, 0.3);
            animation: scaleIn 0.5s ease;
        }
        
        .success-icon i {
            font-size: 3rem;
            color: #16A34A;
            filter: drop-shadow(0 0 10px rgba(22, 163, 74, 0.3));
        }
        
        .failed-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(220, 38, 38, 0.3);
            animation: scaleIn 0.5s ease;
        }
        
        .failed-icon i {
            font-size: 3rem;
            color: #DC2626;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.3));
        }
        
        .timeout-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(245, 158, 11, 0.3);
            animation: scaleIn 0.5s ease;
        }
        
        .timeout-icon i {
            font-size: 3rem;
            color: #F59E0B;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .pulse-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #2563EB;
            border-radius: 50%;
            animation: pulseDot 1.5s ease infinite;
        }
        
        .pulse-dot:nth-child(2) { animation-delay: 0.2s; background: #16A34A; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; background: #F59E0B; }
        
        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== TYPOGRAPHY ===== */
        h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .highlight {
            background: linear-gradient(135deg, #2563EB, #16A34A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ===== PAYMENT DETAILS ===== */
        .details-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border-light);
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }
        
        .detail-label i {
            color: #2563EB;
            font-size: 1rem;
        }
        
        .detail-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .amount-value {
            color: #2563EB;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .reference-value {
            font-family: monospace;
            background: rgba(37, 99, 235, 0.08);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .badge-completed {
            background: rgba(22, 163, 74, 0.12);
            color: #16A34A;
            border: 1px solid rgba(22, 163, 74, 0.3);
        }
        
        .badge-failed {
            background: rgba(220, 38, 38, 0.12);
            color: #DC2626;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            margin-bottom: 12px;
            text-decoration: none;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-outline {
            background: rgba(37, 99, 235, 0.08);
            color: #2563EB;
            border: 1px solid rgba(37, 99, 235, 0.25);
        }
        
        .btn-outline:hover {
            background: rgba(37, 99, 235, 0.15);
        }
        
        .btn-outline i {
            transition: transform 0.3s;
        }
        
        .btn-outline:active i {
            transform: rotate(180deg);
        }
        
        .btn-link {
            background: transparent;
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            border-radius: 40px;
        }
        
        .btn-link:hover {
            color: #2563EB;
            background: rgba(37, 99, 235, 0.05);
        }
        
        .btn-link i {
            color: #2563EB;
        }

        /* ===== FOOTER NOTE ===== */
        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: var(--text-tertiary);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .footer-note i {
            color: #16A34A;
        }

        /* ===== SKELETON ===== */
        .skeleton-card {
            background: rgba(219, 234, 254, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .skeleton-accent {
            height: 4px;
            background: rgba(37, 99, 235, 0.15);
        }
        
        .skeleton-content {
            padding: 40px 32px;
        }
        
        .skeleton-icon {
            width: 80px;
            height: 80px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50%;
            margin: 0 auto 28px;
        }
        
        .skeleton-line {
            height: 16px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .skeleton-line.title {
            width: 60%;
            height: 32px;
            margin: 0 auto 12px;
        }
        
        .skeleton-line.subtitle {
            width: 70%;
            height: 20px;
            margin: 0 auto 28px;
        }
        
        .skeleton-details {
            background: rgba(37, 99, 235, 0.04);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 28px;
        }
        
        .skeleton-button {
            width: 100%;
            height: 52px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50px;
            margin-bottom: 12px;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.04) 25%, rgba(37, 99, 235, 0.12) 50%, rgba(37, 99, 235, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }
        
        .toast {
            background: #1E293B;
            border-left: 4px solid #2563EB;
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 380px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .toast.error { border-left-color: #DC2626; }
        .toast.success { border-left-color: #16A34A; }
        .toast.warning { border-left-color: #F59E0B; }
        
        .toast button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            margin-left: auto;
            cursor: pointer;
            font-size: 1rem;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #2563EB; border-radius: 10px; }
    </style>
</head>
<body>
    <!-- PAGE LOADER - CENTERED DOTS -->
    <div class="page-loader" id="pageLoader">
        <div class="dots-loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container" id="mainContent">
        <!-- Skeleton Card (visible initially) -->
        <div class="skeleton-card" id="skeletonCard">
            <div class="skeleton-accent shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-icon shimmer"></div>
                <div class="skeleton-line title shimmer"></div>
                <div class="skeleton-line subtitle shimmer"></div>
                <div class="skeleton-details shimmer">
                    <div class="skeleton-line" style="width: 100%; height: 20px;"></div>
                    <div class="skeleton-line" style="width: 100%; height: 20px;"></div>
                    <div class="skeleton-line" style="width: 60%; height: 20px;"></div>
                </div>
                <div class="skeleton-button shimmer"></div>
                <div class="skeleton-line" style="width: 40%; height: 16px; margin: 16px auto 0;"></div>
            </div>
        </div>

        <!-- Real Content (hidden initially) -->
        <div class="status-card" id="realCard" style="display: none;">
            <div class="card-accent"></div>
            <div class="card-content">
                <div id="iconArea" class="icon-container">
                    <div class="pending-spinner"></div>
                    <div class="pulse-dots">
                        <div class="pulse-dot"></div>
                        <div class="pulse-dot"></div>
                        <div class="pulse-dot"></div>
                    </div>
                </div>

                <div id="contentArea">
                    <h2>Processing <span class="highlight">Payment</span></h2>
                    <div class="status-message" id="statusMessage">
                        Please wait while we confirm your payment...
                    </div>
                </div>

                <div class="details-card">
                    <div class="detail-row">
                        <span class="detail-label">
                            <i class="bi bi-cash-stack"></i>
                            Amount
                        </span>
                        <span class="detail-value amount-value">MWK {{ payment.amount }}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">
                            <i class="bi bi-upc-scan"></i>
                            Reference
                        </span>
                        <span class="detail-value reference-value">{{ payment.reference }}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">
                            <i class="bi bi-clock-history"></i>
                            Status
                        </span>
                        <span class="status-badge badge-pending" id="statusBadge">Pending</span>
                    </div>
                </div>

                <button onclick="checkPaymentStatus()" class="btn btn-outline" id="checkBtn">
                    <i class="bi bi-arrow-repeat"></i>
                    Check Status Manually
                </button>

                <a href="{{ url_for('dashboard') }}" class="btn-link" id="dashboardLink">
                    <i class="bi bi-house-door"></i>
                    Return to Dashboard
                </a>

                <div class="footer-note">
                    <i class="bi bi-shield-check"></i>
                    Your money is safe. We'll update you automatically once confirmed.
                </div>
            </div>
        </div>
    </div>

    <script>
        let notificationShown = false; // Prevent duplicate notifications
        let redirectTriggered = false; // Prevent multiple redirects

        function showToast(message, type = 'info', duration = 5000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            if (container.children.length >= 3) {
                container.children[0].remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? 'check-circle-fill' :
                      type === 'error' ? 'exclamation-triangle-fill' :
                      type === 'warning' ? 'exclamation-triangle-fill' : 'info-circle-fill';

            toast.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <span>${escapeHtml(message)}</span>
                <button onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, duration);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Loading animation
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const skeleton = document.getElementById('skeletonCard');
                const real = document.getElementById('realCard');
                if(skeleton) skeleton.style.display = 'none';
                if(real) real.style.display = 'block';
            }, 800);
            
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if(loader) loader.classList.add('hidden');
            }, 1200);

            startAutoVerification();
        });

        let verificationAttempts = 0;
        const maxAttempts = 40;
        let paymentId = {{ payment.id }};
        let verificationInterval;

        function startAutoVerification() {
            verifyWithPayChangu();
            verificationInterval = setInterval(verifyWithPayChangu, 3000);
        }

        function verifyWithPayChangu() {
            verificationAttempts++;
            
            fetch(`/api/auto-verify/${paymentId}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'completed') {
                    clearInterval(verificationInterval);
                    updateUIForStatus('completed', data.message);
                    
                    // Show ONLY ONE success notification
                    if (!notificationShown) {
                        notificationShown = true;
                        showToast('✅ Payment successful! Redirecting...', 'success');
                    }
                    
                    // Redirect only once
                    if (!redirectTriggered) {
                        redirectTriggered = true;
                        setTimeout(() => {
                            window.location.href = data.redirect || "{{ url_for('payment_success') }}";
                        }, 1500);
                    }
                    
                } else if (data.status === 'pending') {
                    updateUIForStatus('pending', data.message || 'Waiting for payment confirmation...');
                    
                    const attemptsLeft = maxAttempts - verificationAttempts;
                    if (attemptsLeft <= 10 && attemptsLeft > 0) {
                        const secondsLeft = Math.ceil(attemptsLeft * 3);
                        document.getElementById('statusMessage').innerHTML = 
                            `Still waiting... Will continue checking for ${secondsLeft} more seconds`;
                    }
                    
                } else if (data.status === 'failed') {
                    clearInterval(verificationInterval);
                    updateUIForStatus('failed', data.message || 'Payment failed. Please try again.');
                    
                    if (!notificationShown) {
                        notificationShown = true;
                        showToast('❌ Payment failed. Please try again.', 'error');
                    }
                }
                
                if (verificationAttempts >= maxAttempts) {
                    clearInterval(verificationInterval);
                    if (!notificationShown) {
                        notificationShown = true;
                        showToast('⏳ Payment is taking longer than expected. Please check manually.', 'warning');
                    }
                    updateUIForStatus('timeout', 'Taking longer than expected. You can manually check below.');
                }
            })
            .catch(error => {
                console.error('Verification error:', error);
                if (verificationAttempts < maxAttempts) {
                    document.getElementById('statusMessage').innerHTML = 'Connection issue. Retrying...';
                }
            });
        }

        function updateUIForStatus(status, message) {
            const iconArea = document.getElementById('iconArea');
            const statusBadge = document.getElementById('statusBadge');
            const statusMessage = document.getElementById('statusMessage');
            const contentH2 = document.querySelector('#contentArea h2');
            const checkBtn = document.getElementById('checkBtn');

            if (status === 'completed') {
                iconArea.innerHTML = `<div class="success-icon"><i class="bi bi-check-circle-fill"></i></div>`;
                if(statusBadge) {
                    statusBadge.textContent = 'Completed';
                    statusBadge.className = 'status-badge badge-completed';
                }
                if(statusMessage) statusMessage.innerHTML = message || 'Payment successful! Redirecting...';
                if(contentH2) contentH2.innerHTML = 'Payment <span class="highlight">Successful</span>';
                if(checkBtn) checkBtn.style.display = 'none';
                
            } else if (status === 'failed') {
                iconArea.innerHTML = `<div class="failed-icon"><i class="bi bi-x-circle-fill"></i></div>`;
                if(statusBadge) {
                    statusBadge.textContent = 'Failed';
                    statusBadge.className = 'status-badge badge-failed';
                }
                if(statusMessage) statusMessage.innerHTML = message || 'Payment failed. Please try again.';
                if(contentH2) contentH2.innerHTML = 'Payment <span class="highlight">Failed</span>';
                
            } else if (status === 'timeout') {
                iconArea.innerHTML = `<div class="timeout-icon"><i class="bi bi-hourglass-split"></i></div>`;
                if(statusMessage) statusMessage.innerHTML = message || 'Still processing. You can check manually below.';
                
            } else {
                if(statusMessage) statusMessage.innerHTML = message || 'Processing payment... Please wait.';
                if(statusBadge) {
                    statusBadge.textContent = 'Pending';
                    statusBadge.className = 'status-badge badge-pending';
                }
            }
        }

        function checkPaymentStatus() {
            if (!notificationShown) {
                showToast('Manually checking payment status...', 'info');
            }
            verificationAttempts = 0;
            verifyWithPayChangu();
        }

        window.checkPaymentStatus = checkPaymentStatus;

        // Back button fix
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                const redirectPages = ['/payment_success', '/payment_failed', '/verify_email_code'];
                if (redirectPages.some(page => window.location.pathname.includes(page))) {
                    window.location.replace('/dashboard');
                }
            }
        });

        // Flash messages from server - SKIP to avoid duplicates
        // We rely on our own notifications only
    </script>
</body>
</html>
