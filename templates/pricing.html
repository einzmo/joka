<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Pricing - myMSCE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/history-manager.js') }}"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-blue: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --secondary-green: #16A34A;
            --secondary-light: #DCFCE7;
            --accent-orange: #F59E0B;
            --accent-dark: #D97706;
            --error-red: #DC2626;
            --bg-main: #EFF6FF;
            --card-bg-glass: rgba(219, 234, 254, 0.7);
            --card-bg-solid: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #64748B;
            --border-light: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            padding: 16px;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
        }

        /* ===== PAGE LOADER - DOTS ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .page-loader.hidden { opacity: 0; visibility: hidden; }

        .dots-loader {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-green));
            border-radius: 50%;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.4; }
            to { transform: translateY(-20px); opacity: 1; }
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--primary-blue);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: -16px -16px 16px -16px;
        }
        
        @media (min-width: 768px) {
            .navbar { margin: -20px -20px 20px -20px; padding: 14px 24px; }
        }
        
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }
        
        .close-btn {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-decoration: none;
            color: white;
        }
        
        .close-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.25); }
        .close-btn i { font-size: 1.3rem; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .pricing-header {
            text-align: center;
            margin-bottom: 28px;
        }
        
        .pricing-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        @media (min-width: 768px) {
            .pricing-header h1 { font-size: 2.2rem; margin-bottom: 12px; }
        }
        
        .pricing-header .highlight {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .pricing-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ===== TEST MODE BADGE ===== */
        .test-mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-orange);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ===== TOGGLE SECTIONS ===== */
        .toggle-section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        
        .toggle-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            background: transparent;
        }
        
        .toggle-option.active {
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .toggle-option:active { transform: scale(0.97); }
        
        @media (max-width: 520px) {
            .toggle-section { border-radius: 28px; padding: 8px; }
            .toggle-option { padding: 8px 12px; font-size: 0.75rem; }
        }

        /* ===== PRICE CARD ===== */
        .price-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: var(--shadow-md);
        }
        
        .card-accent {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--secondary-green), var(--accent-orange));
        }
        
        .card-content {
            padding: 28px;
        }
        
        @media (max-width: 480px) {
            .card-content { padding: 22px 20px; }
        }
        
        .form-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary-blue);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .plan-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        
        .duration-name {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        
        .price-container {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            background: rgba(37, 99, 235, 0.02);
            border-radius: 20px;
        }
        
        .price {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
            line-height: 1;
        }
        
        .currency {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-top: 6px;
        }
        
        .amount {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .price-note {
            color: var(--text-tertiary);
            font-size: 0.75rem;
            margin-top: 8px;
        }
        
        .features-list {
            margin-bottom: 24px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 0;
        }
        
        .feature-item i {
            color: var(--secondary-green);
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .get-started-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-orange), #F97316);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
        }
        
        .get-started-btn:active {
            transform: scale(0.97);
            background: var(--accent-dark);
        }
        
        .get-started-btn i {
            margin-left: 8px;
            transition: transform 0.2s;
        }
        
        .get-started-btn:active i { transform: translateX(4px); }

        /* ===== INFO NOTE ===== */
        .info-note {
            text-align: center;
            margin-top: 28px;
            padding: 16px 20px;
            background: rgba(37, 99, 235, 0.05);
            border-radius: 28px;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            backdrop-filter: blur(4px);
        }
        
        .info-note i {
            color: var(--accent-orange);
            margin-right: 6px;
        }

        /* ===== SKELETON LOADING ===== */
        .skeleton-card {
            background: rgba(219, 234, 254, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .skeleton-accent {
            height: 4px;
            background: rgba(37, 99, 235, 0.15);
        }
        
        .skeleton-content {
            padding: 28px;
        }
        
        .skeleton-line {
            height: 14px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .skeleton-line.badge {
            width: 100px;
            height: 28px;
            border-radius: 30px;
        }
        
        .skeleton-line.title {
            width: 60%;
            height: 32px;
        }
        
        .skeleton-line.price {
            width: 50%;
            height: 50px;
            margin: 0 auto;
        }
        
        .skeleton-line.feature {
            width: 90%;
            height: 20px;
        }
        
        .skeleton-button {
            width: 100%;
            height: 52px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 60px;
            margin-top: 20px;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.04) 25%, rgba(37, 99, 235, 0.12) 50%, rgba(37, 99, 235, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== TOAST - BRANDED ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }
        
        .toast {
            background: #1E293B;
            border-left: 4px solid var(--primary-blue);
            padding: 12px 16px;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
            max-width: 360px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-weight: 500;
            font-size: 0.8rem;
            box-shadow: var(--shadow-lg);
        }
        
        .toast.error { border-left-color: var(--error-red); }
        .toast.success { border-left-color: var(--secondary-green); }
        .toast.warning { border-left-color: var(--accent-orange); }
        
        .toast-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
        }
        
        .toast-brand i { font-size: 0.55rem; }
        
        .toast button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            margin-left: auto;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 10px; }

        /* Safe Areas */
        @supports (padding: max(0px)) {
            body { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
            .toast-container { top: max(20px, env(safe-area-inset-top)); }
            .navbar { margin-top: max(-16px, calc(-1 * env(safe-area-inset-top))); }
        }

        /* View Transitions */
        @view-transition { navigation: auto; }
        ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.2s; }
    </style>
</head>
<body>
    <!-- PAGE LOADER - DOTS -->
    <div class="page-loader" id="pageLoader">
        <div class="dots-loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">myMSCE</div>
        <a href="{{ url_for('dashboard') }}" class="close-btn">
            <i class="bi bi-x-lg"></i>
        </a>
    </div>

    <!-- Skeleton Container -->
    <div id="skeletonContent">
        <div class="main-content" style="padding: 20px;">
            <div class="skeleton-card shimmer">
                <div class="skeleton-accent shimmer"></div>
                <div class="skeleton-content">
                    <div class="skeleton-line badge shimmer"></div>
                    <div class="skeleton-line title shimmer"></div>
                    <div class="skeleton-line shimmer" style="width: 40%; height: 14px;"></div>
                    <div style="margin: 20px 0; text-align: center;">
                        <div class="skeleton-line price shimmer" style="margin: 0 auto;"></div>
                    </div>
                    <div class="skeleton-line feature shimmer"></div>
                    <div class="skeleton-line feature shimmer"></div>
                    <div class="skeleton-line feature shimmer"></div>
                    <div class="skeleton-line feature shimmer" style="width: 70%;"></div>
                    <div class="skeleton-button shimmer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Real Content -->
    <div id="realContent" style="display: none;">
        <div class="main-content">
            <div class="pricing-header">
                {% if test_mode %}
                <div class="test-mode-badge">
                    <i class="bi bi-flash-fill"></i> TEST MODE
                </div>
                {% endif %}
                <h1>
                    <span class="highlight">Simple</span> Pricing
                </h1>
                <p>Choose the plan that works for you</p>
            </div>

            <!-- Form Type Toggle -->
            <div class="toggle-section">
                <div class="toggle-group" id="formToggle">
                    <span class="toggle-option active" data-form="form3">📚 Form 3</span>
                    <span class="toggle-option" data-form="form4">🎓 Form 4</span>
                    <span class="toggle-option" data-form="combined">⭐ Combined</span>
                </div>
            </div>

            <!-- Duration Toggle -->
            <div class="toggle-section">
                <div class="toggle-group" id="durationToggle">
                    <span class="toggle-option active" data-duration="daily">🌞 Daily</span>
                    <span class="toggle-option" data-duration="weekly">📅 Weekly</span>
                    <span class="toggle-option" data-duration="monthly">📆 Monthly</span>
                </div>
            </div>

            <!-- Card Container -->
            <div class="card-container" id="pricingContent">
                <div class="price-card" id="priceCard"></div>
            </div>

            <!-- Info Note -->
            <div class="info-note">
                <i class="bi bi-shield-fill-check"></i>
                Airtel Money & TNM Mpamba accepted • Secure payments • Instant access after payment
            </div>
        </div>
    </div>

    <script>
        // Track shown toasts
        let shownToasts = new Set();

        // ===== TOAST FUNCTION with branding =====
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toastKey = `${message}-${type}`;
            if (shownToasts.has(toastKey)) return;
            
            shownToasts.add(toastKey);
            setTimeout(() => shownToasts.delete(toastKey), 2000);
            
            if (container.children.length >= 3) container.children[0].remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'check-circle-fill', error: 'exclamation-triangle-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill' };
            const icon = icons[type] || icons.info;
            
            toast.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <div style="flex: 1;">
                    <span>${escapeHtml(message)}</span>
                    <div class="toast-brand">
                        <i class="bi bi-mortarboard-fill"></i> myMSCE
                    </div>
                </div>
                <button onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-20px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, duration);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== PRICING DATA =====
        const pricingData = {
            form3: {
                daily: {
                    amount: '1,030',
                    description: 'Daily access',
                    note: 'per day • no commitment',
                    features: ['All Form 3 lessons', '25+ video lessons', 'Practice worksheets', '24-hour access']
                },
                weekly: {
                    amount: '6,695',
                    description: 'Weekly access',
                    note: 'per week • 7 days',
                    features: ['All Form 3 lessons', 'Unlimited video views', 'Practice worksheets', 'Progress tracking']
                },
                monthly: {
                    amount: '12,500',
                    description: 'Monthly access',
                    note: 'per month • best value',
                    features: ['All Form 3 lessons', 'All video lessons', 'Downloadable resources', 'Full analytics']
                }
            },
            form4: {
                daily: {
                    amount: '1,030',
                    description: 'Daily access',
                    note: 'per day • no commitment',
                    features: ['All Form 4 lessons', '25+ video lessons', 'Past paper questions', '24-hour access']
                },
                weekly: {
                    amount: '6,695',
                    description: 'Weekly access',
                    note: 'per week • 7 days',
                    features: ['All Form 4 lessons', 'Unlimited video views', 'Past papers', 'Progress tracking']
                },
                monthly: {
                    amount: '12,500',
                    description: 'Monthly access',
                    note: 'per month • best value',
                    features: ['All Form 4 lessons', 'All video lessons', '10 years past papers', 'Exam analytics']
                }
            },
            combined: {
                daily: {
                    amount: '1,545',
                    description: 'Daily access',
                    note: 'per day • both forms',
                    features: ['Form 3 & 4 lessons', '50+ video lessons', 'All worksheets', '24-hour access']
                },
                weekly: {
                    amount: '8,500',
                    description: 'Weekly access',
                    note: 'per week • both forms',
                    features: ['Form 3 & 4 lessons', 'All video lessons', 'All past papers', 'Full tracking']
                },
                monthly: {
                    amount: '19,500',
                    description: 'Monthly access',
                    note: 'per month • complete',
                    features: ['Form 3 & 4 lessons', 'All video lessons (200+)', 'All past papers', 'Priority support']
                }
            }
        };

        const formNames = {
            form3: 'Form 3 Access',
            form4: 'Form 4 Access',
            combined: 'Form 3 & 4 Combined'
        };

        const durationNames = {
            daily: 'Daily',
            weekly: 'Weekly',
            monthly: 'Monthly'
        };

        const formIcons = {
            form3: '3-circle-fill',
            form4: '4-circle-fill',
            combined: 'star-fill'
        };

        // ===== RENDER PRICE CARD =====
        function renderPriceCard(form, duration) {
            const data = pricingData[form][duration];
            const card = document.getElementById('priceCard');
            if (!card) return;

            card.innerHTML = `
                <div class="card-accent"></div>
                <div class="card-content">
                    <div class="form-badge">
                        <i class="bi bi-${formIcons[form]}"></i>
                        ${formNames[form]}
                    </div>
                    <div class="plan-name">${durationNames[duration]}</div>
                    <div class="duration-name">${data.description}</div>
                    <div class="price-container">
                        <div class="price">
                            <span class="currency">MK</span>
                            <span class="amount">${data.amount}</span>
                        </div>
                        <div class="price-note">${data.note}</div>
                    </div>
                    <div class="features-list">
                        ${data.features.map(f => `
                            <div class="feature-item">
                                <i class="bi bi-check-circle-fill"></i>
                                <span>${escapeHtml(f)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <a href="/subscribe/${form}/${duration}" class="get-started-btn">
                        Get Started <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            `;
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            // Loading animation
            setTimeout(() => {
                const skeleton = document.getElementById('skeletonContent');
                const real = document.getElementById('realContent');
                if(skeleton) skeleton.style.display = 'none';
                if(real) real.style.display = 'block';
            }, 800);
            
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if(loader) loader.classList.add('hidden');
            }, 1200);

            // Initialize pricing
            let currentForm = 'form3';
            let currentDuration = 'daily';

            renderPriceCard(currentForm, currentDuration);

            // Form toggle
            const formOptions = document.querySelectorAll('[data-form]');
            formOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    const form = this.dataset.form;
                    formOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    currentForm = form;
                    renderPriceCard(currentForm, currentDuration);
                });
            });

            // Duration toggle
            const durationOptions = document.querySelectorAll('[data-duration]');
            durationOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    const duration = this.dataset.duration;
                    durationOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    currentDuration = duration;
                    renderPriceCard(currentForm, currentDuration);
                });
            });

            // Flash messages
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        setTimeout(() => {
                            showToast("{{ message|safe }}", "{{ category if category in ['success','error','warning'] else 'info' }}");
                        }, {{ loop.index0 * 200 + 500 }});
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });

        // Back button fix
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                const redirectPages = ['/payment_success', '/payment_failed', '/verify_email_code'];
                if (redirectPages.some(page => window.location.pathname.includes(page))) {
                    window.location.replace('/pricing');
                }
            }
        });
    </script>
</body>
</html>
